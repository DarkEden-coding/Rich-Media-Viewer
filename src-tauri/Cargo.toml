[package]
name = "rich-media-viewer"
version = "0.1.0"
description = "Rich Media Viewer desktop app"
authors = ["Rich Media Viewer Contributors"]
edition = "2021"

[lib]
name = "rich_media_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
