[package]
name = "rich-media-viewer"
version = "0.1.0"
description = "Rich Media Viewer desktop app"
authors = ["Rich Media Viewer Contributors"]
default-run = "rich-media-viewer"
edition = "2021"

[lib]
name = "rich_media_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
walkdir = "2"
kamadak-exif = "0.6"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rayon = "1"
sha2 = "0.10"
